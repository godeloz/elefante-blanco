<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Anatomía de un elefante blanco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1b1e;
  --ink-soft:#33474b;
  --rust:#c1502e;
  --env:#ffffff;
  --line:rgba(13,27,30,.16);
  --card:rgba(255,255,255,.55);
  --font-display:'Bebas Neue', Impact, sans-serif;
  --font-body:'Playfair Display', Georgia, serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body); color:var(--ink); background:var(--env);
  min-height:100vh; min-height:100dvh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; transition:background-color 900ms ease;
}
#veil{ position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse 130% 60% at 50% 0%, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 70%); }
#app{ position:relative; z-index:1; padding:26px 18px 90px; }
@media(min-width:820px){ #app{ padding:48px 24px 110px; } }
.wrap{ width:100%; max-width:620px; margin:0 auto; }

h1,h2,h3{ font-family:var(--font-display); font-weight:400; letter-spacing:.02em; margin:0 0 .35em; line-height:1.04; }
h1{ font-size:clamp(2.2rem,9vw,3.1rem); }
h2{ font-size:clamp(1.8rem,7vw,2.4rem); }
h3{ font-size:1.35rem; }
p{ line-height:1.62; margin:0 0 1.05em; font-size:1rem; }
.eyebrow{ font-family:var(--font-mono); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px; opacity:.8;}
.lead{ font-size:1.12rem; }
.quote{ font-style:italic; font-size:1.12rem; line-height:1.5; border-left:3px solid var(--ink); padding-left:16px; margin:22px 0; }
.center{ text-align:center; }
.screen{ animation:fade .55s ease both; }
@keyframes fade{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.mark{ width:56px; height:56px; margin:0 auto 20px; display:block; }

.btn{
  font-family:var(--font-mono); font-size:.8rem; letter-spacing:.06em; text-transform:uppercase;
  background:transparent; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px;
  padding:14px 26px; cursor:pointer; transition:all .22s ease; -webkit-tap-highlight-color:transparent;
}
.btn:hover{ background:var(--ink); color:#fff; }
.btn:focus-visible,.chip:focus-visible,.option:focus-visible,.navb:focus-visible,.casecard:focus-visible{ outline:2px solid var(--rust); outline-offset:3px; }
.btn:disabled{ opacity:.3; cursor:not-allowed; }
.btn:disabled:hover{ background:transparent; color:var(--ink); }
.btn.solid{ background:var(--ink); color:#fff; }
.btn.solid:hover{ background:#000; }
.btn-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:28px; }
.chip{
  font-family:var(--font-mono); font-size:.64rem; letter-spacing:.1em; text-transform:uppercase;
  background:var(--card); color:var(--ink); border:1.2px solid var(--line); border-radius:999px;
  padding:7px 12px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:7px;
}
.chip:hover{ border-color:var(--ink); }
.swatch{ width:22px; height:9px; border-radius:5px; border:1px solid var(--line);
  background:linear-gradient(90deg,#fff,#efe6d4,#f2d98e,#c9e4a4,#82c99a); }
.hint{ font-family:var(--font-mono); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; opacity:.55; text-align:center; margin-top:14px;}
.bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }

/* ---------- thermometer ---------- */
.thermo{ margin:0 0 6px; }
.thermo.big{ margin:22px 0 6px; }
.thermo-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px; }
.thermo-lab{ font-family:var(--font-mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; opacity:.65; }
.thermo-val{ font-family:var(--font-mono); font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; font-weight:500; text-align:right; }
.thermo-track{ height:11px; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden; background:rgba(255,255,255,.6); }
.thermo.big .thermo-track{ height:16px; border-radius:10px; }
.thermo-fill{ height:100%; transition:width 700ms cubic-bezier(.3,.8,.4,1), background 700ms ease; }
.thermo-note{ font-family:var(--font-mono); font-size:.64rem; letter-spacing:.06em; opacity:.6; margin-top:6px; text-transform:uppercase; }

/* ---------- color legend ---------- */
.legend{ margin:18px 0 6px; }
.legend-row{ display:flex; gap:3px; }
.legend-row div{ flex:1; height:30px; border:1.2px solid var(--ink); border-radius:6px; }
.legend-labs{ display:flex; gap:3px; margin-top:6px; }
.legend-labs span{ flex:1; font-family:var(--font-mono); font-size:.56rem; letter-spacing:.04em; text-transform:uppercase; line-height:1.3; }
.legend-labs b{ display:block; font-weight:500; }
.legend-cap{ font-size:.88rem; font-style:italic; opacity:.8; margin:12px 0 0; }
#sheet{ position:fixed; left:0; right:0; bottom:0; z-index:40; transform:translateY(105%); transition:transform .35s ease;
  background:#fff; border-top:1.5px solid var(--ink); border-radius:18px 18px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px rgba(13,27,30,.12); }
#sheet.open{ transform:translateY(0); }
#sheet .wrap{ position:relative; }
.x{ position:absolute; z-index:2; right:-6px; top:-10px; background:none; border:none; font-family:var(--font-mono); font-size:1.3rem; cursor:pointer; color:var(--ink); padding:4px 8px; }

/* ---------- tour (swipe) ---------- */
.tour{ position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; }
.tour-head{ padding:18px 18px 4px; }
.dots{ display:flex; gap:5px; margin:10px 0 2px; }
.dots i{ flex:1; height:3px; border-radius:2px; background:var(--ink); opacity:.14; transition:opacity .3s; }
.dots i.on{ opacity:.85; }
.track{ flex:1; min-height:0; width:100%; max-width:620px; margin:0 auto; display:flex;
  overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; }
.track::-webkit-scrollbar{ display:none; }
.slide{ flex:0 0 100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always; overflow-y:auto; padding:14px 18px 30px; }
.tour-nav{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 18px calc(14px + env(safe-area-inset-bottom)); }
.navb{ width:46px; height:46px; border-radius:50%; border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
  font-family:var(--font-mono); font-size:1.05rem; cursor:pointer; }
.navb:disabled{ opacity:.2; cursor:default; }
.tour-nav .hint{ margin:0; }

/* ---------- symptom card ---------- */
.sc-head{ display:flex; align-items:center; gap:16px; margin:6px 0 16px; }
.sc-ico{ flex:0 0 64px; width:64px; height:64px; }
.sc-head h2{ margin:0; }
.sc-head .eyebrow{ margin-bottom:4px; }
.case{ border-left:3px solid var(--rust); padding:2px 0 2px 15px; margin:18px 0; }
.case-tag{ font-family:var(--font-mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--rust); margin:0 0 7px; }
.case-head{ font-family:var(--font-display); font-size:1.12rem; line-height:1.15; margin:0 0 8px; }
.case p{ margin:0; font-size:.93rem; opacity:.85; }
.ants{ border:1.5px solid var(--ink); border-radius:16px; padding:16px 18px 6px; background:var(--card); margin:20px 0 0; }
.ants .eyebrow{ color:var(--ink); opacity:1; }
.ant{ padding:10px 0; border-top:1px solid var(--line); }
.ant:first-of-type{ border-top:none; padding-top:4px; }
.ant-n{ display:block; font-family:var(--font-display); font-size:1.15rem; letter-spacing:.02em; line-height:1.1; }
.ant-g{ display:block; font-size:.92rem; opacity:.82; line-height:1.45; margin-top:2px; }
.tmsg{ font-style:italic; font-size:.95rem; line-height:1.42; margin:10px 0 0; min-height:2.84em; }
.tour-head{ border-bottom:1px solid var(--line); padding-bottom:10px; }
.pulse{ margin:22px 0 0; padding:14px 0 0; border-top:1.5px solid var(--ink); }
.pulse p{ margin:0; font-style:italic; font-size:1.05rem; line-height:1.5; }

/* ---------- cases ---------- */
.casecard{ display:block; width:100%; text-align:left; border:1.5px solid var(--ink); border-radius:18px; padding:20px 20px 18px;
  margin:0 0 14px; cursor:pointer; color:var(--ink); font-family:var(--font-body); transition:transform .2s ease, box-shadow .2s ease; }
.casecard:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(13,27,30,.12); }
.cc-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
.badge{ display:inline-block; font-family:var(--font-mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase;
  padding:4px 10px; border-radius:999px; border:1.5px solid currentColor; }
.cc-n{ font-family:var(--font-mono); font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; }
.cc-title{ font-family:var(--font-display); font-size:2rem; line-height:1; margin:0 0 4px; }
.cc-sector{ font-family:var(--font-mono); font-size:.64rem; letter-spacing:.08em; text-transform:uppercase; opacity:.7; margin:0 0 10px; }
.cc-teaser{ font-style:italic; font-size:.98rem; margin:0 0 12px; }
.cc-foot{ font-family:var(--font-mono); font-size:.64rem; letter-spacing:.06em; text-transform:uppercase; opacity:.75; margin:0; }

/* ---------- story & play ---------- */
.story p{ font-size:1.08rem; line-height:1.68; }
.story p:first-child::first-letter{ font-family:var(--font-display); font-size:3.3em; float:left; line-height:.8; margin:5px 3px 0 -2px; }
.story.plain p:first-child::first-letter{ font:inherit; float:none; margin:0; }
.symtag{ display:flex; align-items:center; gap:12px; border-top:1.5px solid var(--ink); border-bottom:1px solid var(--line); padding:12px 0; margin:18px 0 20px; }
.symtag svg{ flex:0 0 38px; width:38px; height:38px; }
.symtag .nm{ flex:1; min-width:0; }
.symtag .nm p{ margin:0; }
.symname{ font-family:var(--font-display); font-size:1.25rem; line-height:1.05; }
.reveal{ border:1px dashed var(--line); border-radius:14px; margin:0 0 18px; overflow:hidden; background:rgba(255,255,255,.25); }
.reveal-btn{ width:100%; background:none; border:none; padding:12px 16px; text-align:left; cursor:pointer;
  font-family:var(--font-mono); font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); opacity:.75; }
.reveal-body{ display:none; padding:0 16px 8px; }
.reveal.open .reveal-body{ display:block; animation:fade .3s ease both; }
.reveal-body p{ font-size:.93rem; opacity:.85; }
.q{ font-family:var(--font-display); font-size:1.35rem; margin:26px 0 14px; line-height:1.1; }
.option{ display:block; width:100%; text-align:left; border:1.5px solid var(--line); border-radius:14px;
  background:var(--card); padding:15px 17px; margin-bottom:11px; cursor:pointer;
  font-family:var(--font-body); font-size:.97rem; line-height:1.45; color:var(--ink); transition:all .2s ease; }
.option:hover{ border-color:var(--ink); }
.option.chosen{ border-color:var(--ink); border-width:2.5px; background:rgba(255,255,255,.88); }
.option.locked{ cursor:default; }
.option.locked:not(.chosen){ opacity:.4; }
.fb{ border-left:3px solid currentColor; padding-left:16px; margin:20px 0 0; animation:fade .4s ease both; }
.fb p{ margin:6px 0 0; font-style:italic; font-size:1rem; color:var(--ink); }
.peeked{ font-family:var(--font-mono); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; opacity:.6; margin-left:6px; }

/* ---------- overlay ficha ---------- */
#ov{ position:fixed; inset:0; z-index:30; overflow-y:auto; display:none; background:var(--env); }
#ov.open{ display:block; animation:fade .3s ease both; }
#ov .inner{ position:relative; padding:20px 18px 60px; }
#ov .closebar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }

/* ---------- end ---------- */
.dx-item{ border-top:1px solid var(--line); padding:20px 0; display:flex; gap:15px; align-items:flex-start; }
.dx-item:last-of-type{ border-bottom:1px solid var(--line); }
.dx-ico{ flex:0 0 38px; width:38px; height:38px; }
.dx-main{ flex:1; min-width:0; }
.dx-name{ font-family:var(--font-display); font-size:1.25rem; line-height:1.1; margin:0 0 6px; }
.dx-main p{ font-size:.93rem; margin:8px 0 0; }
.dx-choice{ opacity:.7; font-style:italic; }
.sec{ margin-top:40px; }
.prac{ border:1.5px solid var(--ink); border-radius:16px; padding:16px 18px; background:var(--card); margin-bottom:12px; }
.prac h3{ font-size:1.2rem; margin:0 0 10px; }
.prac .lab{ font-family:var(--font-mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; opacity:.65; margin:10px 0 2px; }
.prac p{ margin:0; font-size:.95rem; }
.prac .pq{ font-style:italic; font-size:1.02rem; }
details.more{ margin-top:8px; }
details.more summary{ font-family:var(--font-mono); font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; padding:10px 0; opacity:.75; }
.foot{ font-family:var(--font-mono); font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; opacity:.45; text-align:center; margin-top:50px; }

@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div id="veil"></div>
<div id="app"></div>
<div id="ov"></div>
<div id="sheet" role="dialog" aria-label="Qué significa el color"><div class="wrap"><button class="x" data-legend aria-label="Cerrar">×</button><p class="eyebrow" style="padding-right:44px">Cómo leer el color</p><div id="sheet-body"></div></div></div>
<script>
const ICO=[
/* 1 Defecto congénito: edificio agrietado desde los cimientos */
`<path d="M11 41 V15 L24 7 L37 15 V41"/><line x1="6" y1="41" x2="42" y2="41"/><path d="M24 41 L21 34 L27 28 L22 21 L25 16"/>`,
/* 2 Insuficiencia de mando: volante con placa de aprendiz */
`<circle cx="19" cy="28" r="13"/><circle cx="19" cy="28" r="3.5"/><line x1="6" y1="28" x2="15.5" y2="28"/><line x1="22.5" y1="28" x2="32" y2="28"/><line x1="19" y1="31.5" x2="19" y2="41"/><rect x="29" y="4" width="15" height="15" rx="2"/><path d="M34 8 V15 H39.5"/>`,
/* 3 Fiebre de inauguración: calendario en llamas */
`<rect x="8" y="10" width="32" height="31" rx="3"/><line x1="8" y1="18" x2="40" y2="18"/><line x1="16" y1="6" x2="16" y2="13"/><line x1="32" y1="6" x2="32" y2="13"/><path d="M24 37 C19.5 37 18 32.5 20 29 C21 31 22.5 31 22.5 29 C22.5 26 24 24 26.5 22.5 C25.5 26.5 30 27.5 29 32.5 C28.5 35 26.5 37 24 37 Z"/>`,
/* 4 Ego inflamado: busto sobre pedestal */
`<circle cx="24" cy="15" r="6"/><path d="M13 31 C13 23 35 23 35 31"/><rect x="11" y="31" width="26" height="10" rx="1"/><line x1="24" y1="3" x2="24" y2="5.5"/><line x1="15" y1="6" x2="16.8" y2="7.8"/><line x1="33" y1="6" x2="31.2" y2="7.8"/>`,
/* 5 Orfandad administrativa: silla vacía */
`<path d="M15 42 V7"/><path d="M15 26 H34 V42"/><line x1="15" y1="12" x2="21" y2="12"/><line x1="15" y1="18" x2="21" y2="18"/>`,
/* 6 Desnutrición presupuestal: batería baja */
`<rect x="5" y="15" width="34" height="18" rx="3"/><line x1="43" y1="20.5" x2="43" y2="27.5"/><rect x="9" y="19" width="5" height="10" rx="1" fill="currentColor" stroke="none"/>`,
/* 7 Contratación parasitaria: contrato que se multiplica en otrosíes */
`<rect x="7" y="16" width="21" height="26" rx="2"/><path d="M14 16 V10 H35 V36 H28"/><path d="M21 10 V4 H42 V30 H35"/><line x1="11" y1="24" x2="24" y2="24"/><line x1="11" y1="29" x2="24" y2="29"/><line x1="11" y1="34" x2="19" y2="34"/>`,
/* 8 Diagnóstico equivocado: la flecha cae fuera de la diana */
`<circle cx="18" cy="19" r="12"/><circle cx="18" cy="19" r="6"/><circle cx="18" cy="19" r="1.6" fill="currentColor" stroke="none"/><line x1="31" y1="41" x2="43" y2="29"/><path d="M31 36 V41 H36"/><path d="M43 29 H46"/><path d="M43 29 V26"/>`,
/* 9 Inmunodeficiencia institucional: señal de pare que ya no detiene */
`<path d="M17.9 9.2 H30.1 L38.8 17.9 V30.1 L30.1 38.8 H17.9 L9.2 30.1 V17.9 Z" stroke-dasharray="3 3"/><line x1="16" y1="24" x2="32" y2="24" stroke-width="3"/>`,
/* 10 Atrofia de propósito: flor marchita */
`<path d="M16 32 H32 L30 42 H18 Z"/><path d="M24 32 V21 C24 12 35 11 36 19"/><circle cx="36" cy="23" r="3.5"/><path d="M24 26 C21 24 18 25 17 28"/>`,
/* 11 Identidad enquistada: ancla */
`<circle cx="24" cy="8" r="3.5"/><line x1="24" y1="11.5" x2="24" y2="41"/><line x1="16" y1="18" x2="32" y2="18"/><path d="M9 29 C10 37 18 41 24 41 C30 41 38 37 39 29"/><path d="M6 32 L9 28.5 L12.5 31.5"/><path d="M42 32 L39 28.5 L35.5 31.5"/>`
];
/* ========================= SÍNTOMAS ========================= */
/* Orden fijo del recorrido. Los índices (0–10) son los que usan los casos. */
const S=[
{sym:"Defecto congénito",
 orig:"Nadie hizo el estudio de factibilidad antes de comprometer el presupuesto. Se arranca sin saber si hay plata suficiente para terminar, equipar y sostener lo que se está construyendo.",
 ch:"El megahospital de 500 millones de dólares que iba a ser el más grande de Latinoamérica hoy está abandonado",
 cs:"En Sopó, cerca de Bogotá, el Hospital Internacional de Alta Tecnología se levanta como una estructura monumental que alguna vez prometió revolucionar la salud del país, y hoy yace abandonado.",
 ants:[
  {n:"Mirada multiaxial",g:"Lo financiero, lo político y lo territorial leídos en la misma mesa."},
  {n:"Costo completo",g:"Construir, equipar y sostener, calculados antes del anuncio."},
  {n:"Cláusula de salida",g:"Pactar desde el inicio en qué condiciones se detiene."}],
 senal:"El anuncio llegó antes que las cifras de operación.",
 preg:"¿Cuánto cuesta sostener esto el tercer año, y quién lo va a pagar?"},

{sym:"Insuficiencia de mando",
 orig:"Lo lidera alguien sin la competencia técnica que el tamaño del proyecto exige. La ambición del proyecto supera la experiencia de quien lo conduce.",
 ch:"Inaugurada dos veces, la planta siderúrgica del Mutún nunca produjo un kilo de acero",
 cs:"Una auditoría técnica en Bolivia identificó fallas que van desde el diseño original de la planta hasta la ejecución de las obras civiles, con más de 300 observaciones técnicas sin resolver.",
 ants:[
  {n:"Liderazgo complementario",g:"La experiencia que falta entra al núcleo que decide, con voto."},
  {n:"Escala progresiva",g:"Probar en pequeño antes de comprometer lo grande."}],
 senal:"Las preguntas técnicas se responden con entusiasmo.",
 preg:"¿Quién, entre quienes deciden, ha hecho antes algo de este tamaño?"},

{sym:"Fiebre de inauguración",
 orig:"Nace atado a un evento con fecha fija. El calendario político manda sobre la planeación técnica, y una vez pasado el evento, la razón de ser original se evapora.",
 ch:"El estadio de 300 millones de dólares que solo vio cuatro partidos después del Mundial",
 cs:"La Arena da Amazônia se construyó en Manaos para el Mundial de Brasil 2014, en una ciudad sin ningún equipo de primera división que pudiera llenarla después.",
 ants:[
  {n:"Criterio antes que fecha",g:"La fecha se mueve si el criterio técnico no se cumple."},
  {n:"Diseñar el día siguiente",g:"Saber quién lo usa cuando se apagan las cámaras."}],
 senal:"La fecha aparece en todas las reuniones y el criterio técnico en ninguna.",
 preg:"¿Qué tendría que pasar para mover la fecha, y quién puede decidirlo?"},

{sym:"Ego inflamado",
 orig:"El ego de quien lo impulsa queda atado al proyecto. Detenerlo se lee como una derrota personal, no como una corrección técnica.",
 ch:"El monumento del Bicentenario que terminó costando casi el triple de lo presupuestado",
 cs:"La Estela de Luz, construida para los festejos del Bicentenario de México, costó 192% más de lo programado según la Auditoría Superior de la Federación, y terminó rebautizada por la opinión pública como «el monumento a la corrupción».",
 ants:[
  {n:"Soltar protagonismo",g:"Otra voz conduce o comunica la decisión difícil."},
  {n:"Evidencia pactada",g:"Acordar antes qué datos harían cambiar el rumbo."}],
 senal:"Criticar el proyecto suena a criticar a una persona.",
 preg:"¿Qué evidencia nos haría cambiar de rumbo, y quién la presentaría?"},

{sym:"Orfandad administrativa",

{id:"atlas", title:"Atlas", level:"Leve", sector:"Empresa privada · plataforma digital",

   q:"El replanteamiento hay que comunicarlo. ¿Cómo lo haces?",

    {t:"Preparas un informe impecable, con datos y escenarios, para que el presidente lo entienda y anuncie él mismo el cambio.",e:60,f:"Los datos son buenos, pero el cambio sigue necesitando la voz del presidente para existir. Atlas sigue atado a su nombre."},
    {t:"Le pides al presidente que asuma el cambio en público, con firmeza, como señal de liderazgo.",e:15,f:"Suena valiente. Vuelve a poner el ego en el centro del escenario, ahora con un giro heroico."}]},

    {t:"Contratas desarrolladores externos y organizas turnos dobles para llegar al 15.",e:60,f:"Trabajo heroico al servicio del calendario. Nadie revisó si lo que llega el 15 va a servir."},
    {t:"Propones lanzar el 15 una versión de demostración para la pantalla de la fiesta, y terminar después.",e:15,f:"La fecha sigue mandando; solo cambia lo que se le entrega. Las demos de fiesta suelen quedarse como producto final."}]},

   q:"El diseño está casi cerrado. ¿Qué haces?",

    {t:"Lanzas tal cual y programas una encuesta de satisfacción para los vendedores a los tres meses.",e:60,f:"Vas a escuchar. Cuando ya no quede nada por cambiar."},
    {t:"Le pides a la consultora referencias de plataformas parecidas que hayan funcionado en otras empresas.",e:15,f:"Razonable. Sigues sin preguntarle al hombre de la libreta."}]},
  {s:5, text:[
    "El presupuesto de Atlas cubre licencias, desarrollo y la fiesta. Termina el 15 de marzo.",

    {t:"Agregas una línea de imprevistos del diez por ciento dentro del presupuesto del proyecto.",e:60,f:"Hay algo de plata, mezclada e informal. Es la primera que se recorta cuando la fiesta cueste más."},
    {t:"Aceptas que se vea después: el año próximo habrá otro presupuesto.",e:15,f:"Repite el patrón exacto que deja proyectos terminados y sin vida."}]},

{id:"casa", title:"La Casa del Puerto", level:"Intermedio", sector:"Gobierno local · centro cultural",
 teaser:"Un teatro de novecientas butacas para un puerto donde la banda municipal ensaya debajo de un mango.",
 intro:[
  "Puerto Arenal tiene un río ancho y color café, dos colegios, y una banda municipal que ensaya debajo de un mango porque no tiene dónde.",
  "La alcaldesa promete en campaña la Casa del Puerto: un gran teatro a la orilla del río, el más moderno de la región.",
  "Gana. Te nombra al frente de la Secretaría de Cultura. El teatro es tuyo.",
  "La Casa del Puerto trae ocho síntomas. En el render, todavía se ve preciosa."],
 steps:[
  {s:0, text:[
    "La primera reunión dura veinte minutos. Hay un render: vidrio, madera, el río reflejado en la fachada.",

   q:"Te piden tu firma. ¿Qué haces?",
   op:[
    {t:"Pides que, antes de comprometer un peso, se sienten en la misma mesa y con poder de decisión Hacienda, Planeación, tu secretaría y la junta comunal del barrio del río.",e:100,f:"Las lecturas se cruzan antes del primer peso. El render tendrá que sostenerse frente a todas."},
    {t:"Pides a Hacienda, a Jurídica y a Planeación que cada una entregue su concepto de viabilidad antes de firmar.",e:60,f:"Tres informes que nadie va a cruzar. Cada uno dirá que su parte está bien."},
    {t:"Contratas a una firma de arquitectura reconocida para que avale el proyecto.",e:15,f:"Una sola voz, prestigiosa, mirando un solo eje: el edificio."}]},
  {s:2, text:[
    "La alcaldesa quiere inaugurar en las Fiestas del Río, en diciembre de su último año. Faltan catorce meses.",
    "El ingeniero dice que la acústica necesita veinte. Las Fiestas no se mueven: llevan noventa años en la misma semana."],
   q:"¿Qué haces?",
   op:[
    {t:"Propones fijar primero los criterios de entrega —acústica, seguridad, evacuación— y aceptar en público que la apertura se mueve si no se cumplen. En las Fiestas se celebra la obra en curso.",e:100,f:"La fecha se queda para la fiesta. El criterio decide cuándo abre el teatro."},
    {t:"Pides triplicar los turnos de obra para llegar a diciembre.",e:60,f:"Resuelves la prisa. La acústica se termina a la carrera, y se nota en el primer concierto."},
    {t:"Propones inaugurar en diciembre la fachada y el vestíbulo, y terminar la sala después.",e:15,f:"La fecha sigue mandando. Lo que se inaugura a medias rara vez se termina."}]},
  {s:7, text:[
    "El diseño tiene una sala de novecientas butacas. En Puerto Arenal, el concierto más grande del año reúne a trescientas personas, y es gratis.",
    "La banda pide un salón de ensayo con techo. Los colegios, un lugar para talleres por la tarde. Nadie se los preguntó."],
   q:"¿Qué haces con el diseño?",
   op:[
    {t:"Antes de cerrar planos, haces mesas de trabajo con la banda, los colegios y los grupos del barrio, y el diseño se ajusta a lo que van a usar cada semana.",e:100,f:"La necesidad real, la de los martes por la tarde, define el edificio."},
    {t:"Mantienes el diseño y prometes una consulta ciudadana sobre la programación cuando el teatro abra.",e:60,f:"Escuchas a tiempo para decidir la programación. Tarde para decidir el edificio."},
    {t:"Te basas en teatros exitosos de las ciudades grandes de la región.",e:15,f:"Funcionan allá. Sigues sin preguntar quién vive aquí."}]},
  {s:3, text:[
    "Una placa de bronce ya tiene el nombre de la sala: Sala Ernesto Mejía, el padre de la alcaldesa.",
    "Cuando el ingeniero propone reducirla a cuatrocientas butacas, ella lo toma como una ofensa. «Achicarlo es achicarme», dice en el consejo de gobierno."],
   q:"Hay que presentar la reducción. ¿Cómo?",
   op:[
    {t:"Propones que la presente el director de la banda municipal, que la necesita y la conoce, y que la alcaldesa la reciba como una propuesta de la comunidad.",e:100,f:"El cambio llega con otra cara. Ya no es la derrota de nadie."},
    {t:"Le preparas a la alcaldesa un documento con cifras de ocupación de otros teatros para que lo anuncie ella.",e:60,f:"El argumento es bueno. El cambio sigue dependiendo de que ella lo diga."},
    {t:"Le recomiendas anunciar la reducción ella misma, con firmeza, en rueda de prensa.",e:15,f:"Suena a liderazgo. Pone la placa, y el ego, en el centro de la decisión."}]},
  {s:5, text:[
    "El presupuesto alcanza para el edificio.",
    "El aire acondicionado de una sala de novecientas butacas a la orilla del río cuesta al año lo mismo que la nómina entera de la Secretaría. Nadie lo calculó."],
   q:"La licitación se abre en un mes. ¿Qué haces?",
   op:[
    {t:"Exiges, como condición para abrir la licitación, un presupuesto aprobado y separado para los tres primeros años de operación.",e:100,f:"El después queda protegido con la misma fuerza que la obra."},
    {t:"Incluyes una partida de imprevistos dentro del contrato de construcción.",e:60,f:"Plata mezclada con la obra. La obra se la va a comer."},
    {t:"Dejas la operación para el presupuesto del próximo gobierno.",e:15,f:"Le pasas el elefante a quien venga. Con hambre."}]},
  {s:4, text:[
    "Diciembre llega. Las Fiestas, la banda debajo del mango, el teatro sin techo.",

   q:"¿Qué haces?",
   op:[

    {t:"Aceptas quedarte como responsable: conoces el proyecto mejor que nadie.",e:60,f:"Suena a compromiso. El proyecto sigue colgando de una sola persona. Ahora, de ti."},
    {t:"Redactas el informe de gestión que exige la ley y lo radicas.",e:15,f:"Cumple el trámite. Un informe radicado no le explica nada a nadie."}]},
  {s:9, text:[
    "Cuatro años después, la Casa del Puerto abre.",

   q:"Te piden el informe de los primeros seis meses. ¿Qué propones?",
   op:[
    {t:"Una revisión del teatro contra su propósito —que la cultura del puerto tuviera casa—, con autoridad para cambiar su uso: la sala pequeña para la banda, las tardes para los colegios.",e:100,f:"El propósito vuelve a ser la vara. Y alguien tiene permiso de redirigir."},
    {t:"Cifras de ocupación: la sala estuvo alquilada el setenta por ciento de los fines de semana.",e:60,f:"La sala está llena. De matrimonios. El propósito no aparece en ninguna columna."},
    {t:"Esperar al cierre del gobierno para evaluar el impacto.",e:15,f:"La evaluación llega como autopsia."}]},
  {s:10, text:[
    "El teatro le cuesta a la ciudad, en mantenimiento, más que sus dos colegios juntos. Un concejal propone convertirlo en otra cosa.",
    "La respuesta es un coro: «Es el orgullo del puerto». «Costó demasiado para rendirnos ahora». En la fachada, el río sigue reflejado en el vidrio."],
   q:"Te toca fijar posición ante el concejo. ¿Qué haces?",
   op:[
    {t:"Reconoces en público que el diseño original fue un error, presentas la evidencia y propones transformar el uso, asumiendo la responsabilidad sin culpar a nadie.",e:100,f:"Absorbes el costo de admitirlo. La ciudad puede quedarse con el edificio sin quedarse con el error."},
    {t:"Propones esperar al próximo gobierno, para que la decisión llegue como herencia.",e:60,f:"El costo pasa a otra persona. Mientras tanto, el elefante come."},
    {t:"Lanzas una campaña que muestre el teatro como símbolo de la ciudad, mientras se buscan resultados que lo justifiquen.",e:15,f:"Evitas el costo de admitirlo. Con eso, evitas también la cura."}]}

{id:"cable", title:"El Cable del Bicentenario", level:"Grave", sector:"Gobierno regional · teleférico",

 intro:[
  "Altamira está a dos mil seiscientos metros. Desde la plaza se ve el cerro de La Cruz y, colgado de su ladera, el barrio La Esperanza: once mil personas que bajan cada mañana por una escalera de cemento de cuarenta minutos.",
  "El gobernador anuncia en televisión el Cable del Bicentenario: un teleférico hasta la cima, con un museo de la provincia arriba, entre las nubes.",
  "Te nombran en la junta directiva de la empresa que lo va a construir. Tienes voz y voto.",
  "El Cable trae los once síntomas. Todavía es un dibujo."],
 steps:[
  {s:0, text:[
    "El costo apareció en la entrevista de televisión: ochenta mil millones. Nadie sabe de dónde salió la cifra.",
    "No hay estudio de suelos, ni de demanda, ni cálculo de lo que cuesta operar un cable en un cerro donde llueve nueve meses al año. La asamblea aprueba la plata en una sola sesión."],
   q:"La junta debe autorizar el primer desembolso. ¿Qué propones?",
   op:[
    {t:"Que antes del desembolso se conforme una mesa con poder de decisión conjunta: finanzas, ingeniería, la gobernación y la junta comunal de La Esperanza.",e:100,f:"Cuatro lecturas en la misma mesa, con autoridad compartida, antes del primer peso."},
    {t:"Que finanzas, jurídica y prensa entreguen, cada una, su informe de viabilidad antes del desembolso.",e:60,f:"Tres informes que nadie va a cruzar. Prensa dirá que el anuncio fue un éxito."},
    {t:"Que una universidad de prestigio avale técnicamente el proyecto.",e:15,f:"Un sello de autoridad sobre un solo eje. El resto de la mesa sigue vacía."}]},
  {s:1, text:[
    "Para dirigir la obra, el gobernador nombra a su jefe de campaña: un publicista brillante que nunca ha construido nada más alto que una valla.",
    "En la primera reunión técnica pregunta qué es una torre de anclaje. Lo pregunta con humor. Nadie se ríe."],

/* ========================= COLOR ========================= */
const UNIT=100/S.length;
const STOPS=[{v:0,c:'#ffffff'},{v:25,c:'#efe6d4'},{v:50,c:'#f2d98e'},{v:75,c:'#c9e4a4'},{v:100,c:'#82c99a'}];
const BANDS=[
  {min:80,label:'Saludable',t:'#2d6e45',d:'Respira. Cumple su propósito y se sostiene.'},
  {min:60,label:'En recuperación',t:'#4f7424',d:'Tiene síntomas, pero alguien los está tratando.'},
  {min:40,label:'En riesgo',t:'#94650a',d:'Los síntomas ya se notan desde afuera.'},
  {min:20,label:'Grave',t:'#8a5a32',d:'Los síntomas se alimentan entre sí.'},
  {min:0, label:'Elefante blanco',t:'#6f695f',d:'Imposible de sostener, imposible de abandonar.'}
];
const bandOf=v=>BANDS.find(b=>v>=b.min-1e-9);
const RS={100:{l:'Resuelto',c:'#2d6e45'},60:{l:'Contenido',c:'#94650a'},15:{l:'Sigue activo',c:'#c1502e'}};
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const hx=v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0');
function col(v){
  v=Math.max(0,Math.min(100,v));
  for(let i=0;i<STOPS.length-1;i++){ const a=STOPS[i],b=STOPS[i+1];
    if(v>=a.v&&v<=b.v){ const t=(v-a.v)/(b.v-a.v),c0=hex2rgb(a.c),c1=hex2rgb(b.c);
      return '#'+hx(c0[0]+(c1[0]-c0[0])*t)+hx(c0[1]+(c1[1]-c0[1])*t)+hx(c0[2]+(c1[2]-c0[2])*t); } }
  return STOPS[STOPS.length-1].c;
}
function paint(v){ const c=col(v); document.documentElement.style.setProperty('--env',c); document.body.style.backgroundColor=c; }
const pct=v=>Math.round(Math.max(0,Math.min(100,v)));

/* ========================= HELPERS ========================= */
const svg=(inner,cls,style)=>`<svg class="${cls}" ${style?`style="${style}"`:''} viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const app=()=>document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const two=n=>String(n).padStart(2,'0');

function thermo(v,lab,big,note){
  const b=bandOf(v);
  return `<div class="thermo ${big?'big':''}">
    <div class="thermo-top"><span class="thermo-lab">${lab}</span><span class="thermo-val" style="color:${b.t}">${b.label} · ${pct(v)}%</span></div>
    <div class="thermo-track"><div class="thermo-fill" style="width:${Math.max(1.5,v)}%;background:${col(Math.max(10,v))}"></div></div>
    ${note?`<p class="thermo-note">${note}</p>`:''}
  </div>`;
}
function legendHTML(){
  const bs=BANDS.slice().reverse(); // blanco → saludable
  const rng=['0–19','20–39','40–59','60–79','80–100'];
  return `<div class="legend">
    <div class="legend-row">${bs.map((b,i)=>`<div style="background:${col(i*20+10)}"></div>`).join('')}</div>
    <div class="legend-labs">${bs.map((b,i)=>`<span style="color:${b.t}"><b>${b.label}</b>${rng[i]}%</span>`).join('')}</div>
    <p class="legend-cap">El blanco es la enfermedad: el color del elefante que nadie puede usar ni abandonar. Mientras más vivo el color, más sano el proyecto.</p>
  </div>`;
}
const legendChip=()=>`<button class="chip" data-legend><span class="swatch"></span>El color</button>`;
function symCard(i,msg,last){
  const s=S[i];
  return `<div class="sc-head">${svg(ICO[i],'sc-ico')}<div><p class="eyebrow">Síntoma ${two(i+1)}</p><h2>${s.sym}</h2></div></div>
    <p>${s.orig}</p>
    <div class="case"><p class="case-tag">Caso real</p><p class="case-head">${s.ch}</p><p>${s.cs}</p></div>
    <div class="ants"><p class="eyebrow">Antídotos posibles</p>
      ${s.ants.map(a=>`<div class="ant"><span class="ant-n">${a.n}</span><span class="ant-g">${a.g}</span></div>`).join('')}
    </div>
    ${msg?`<div class="pulse"><p>${msg}</p></div>`:''}
    ${last?`<div class="btn-row"><button class="btn solid" data-go="cases">Elegir un caso</button></div>`:''}`;
}

/* ========================= STATE ========================= */
const st={ screen:'l1', ti:0, cid:null, k:0, sel:null, decided:false, peek:false, opts:[], res:[], done:{} };
const cur=()=>CASES.find(c=>c.id===st.cid);
const startOf=c=>Math.max(0,100-c.steps.length*UNIT);
const healthOf=(c,res)=>startOf(c)+res.reduce((a,r)=>a+r.e,0)/100*UNIT;
const tourHealth=i=>100-i*UNIT;

    <p class="quote" style="text-align:left">El regalo nunca fue el elefante. El regalo fue la trampa de no poder deshacerse de él.</p>

/* ---- tour: gift + 11 swipeable symptom cards ---- */
function tour(){
  app().innerHTML='';
  const slides=[`<div class="slide" data-i="0">
      <h1 style="margin-top:6px">Acabas de recibir un elefante blanco</h1>
      <p class="lead">Llega sano: verde, con todas las promesas intactas. Nadie te ha dicho todavía cuánto va a costar alimentarlo.</p>
      <p>Desliza hacia la izquierda para conocer sus once síntomas. Con cada uno, el color de la pantalla se irá apagando.</p>
      <p class="eyebrow" style="margin-top:24px">Cómo leer el color</p>
      ${legendHTML()}
    </div>`];
  S.forEach((s,i)=>slides.push(`<div class="slide" data-i="${i+1}">${symCard(i,null,i===S.length-1)}</div>`));
  const t=document.createElement('div');
  t.className='tour screen';
  t.innerHTML=`<div class="tour-head wrap">
      <div class="bar" style="margin-bottom:10px"><span class="eyebrow" id="tc" style="margin:0">El regalo</span>${legendChip()}</div>
      <div id="tth"></div>
      <div class="dots" id="dots">${S.map(()=>'<i></i>').join('')}</div>
      <p class="tmsg" id="tm" aria-live="polite"></p>
    </div>
    <div class="track" id="track" tabindex="0" aria-label="Síntomas del elefante">${slides.join('')}</div>
    <div class="tour-nav wrap">
      <button class="navb" id="prv" aria-label="Anterior">←</button>
      <span class="hint" id="th">Desliza hacia la izquierda</span>
      <button class="navb" id="nxt" aria-label="Siguiente">→</button>
    </div>`;
  app().appendChild(t);
  const tr=document.getElementById('track');
  const go2=i=>{ i=Math.max(0,Math.min(S.length,i)); tr.scrollTo({left:i*tr.clientWidth,behavior:'smooth'}); };
  document.getElementById('prv').onclick=()=>go2(st.ti-1);
  document.getElementById('nxt').onclick=()=>go2(st.ti+1);
  let raf=0;
  tr.addEventListener('scroll',()=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0;
    const i=Math.round(tr.scrollLeft/tr.clientWidth); if(i!==st.ti){ st.ti=i; updTour(); } }); });
  st._resize=()=>{ tr.scrollLeft=st.ti*tr.clientWidth; };
  requestAnimationFrame(()=>{ tr.scrollLeft=st.ti*tr.clientWidth; updTour(); });
  updTour();
}
function updTour(){
  const i=st.ti, v=tourHealth(i);
  paint(v);
  const tc=document.getElementById('tc'); if(!tc) return;
  tc.textContent= i===0 ? 'El regalo' : `Síntoma ${i} de ${S.length}`;
  document.getElementById('tth').innerHTML=thermo(v,'Salud del elefante');
  document.getElementById('tm').textContent= i===0 ? 'Así llega: sano. Todavía no le has visto ningún síntoma.' : MSG[i-1];
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k<i));
  document.getElementById('prv').disabled=i===0;
  document.getElementById('nxt').disabled=i===S.length;
  document.getElementById('th').textContent= i===0?'Desliza hacia la izquierda': i===S.length?'Ya conoces tu elefante':'Desliza para ver el siguiente';
}

/* ---- play: one chapter per symptom ---- */
function play(){
  const c=cur(), step=c.steps[st.k], s=S[step.s];
  st.sel=null; st.decided=false; st.peek=false; st.opts=shuffle(step.op);
  const v=healthOf(c,st.res);
  paint(v);
  const prev=[...c.intro.map(p=>`<p>${p}</p>`), ...c.steps.slice(0,st.k).map(x=>x.text.map(p=>`<p>${p}</p>`).join(''))].join('');
  app().innerHTML=`<div class="screen wrap">
    <div class="bar"><p class="eyebrow" style="margin:0">${c.title} · Capítulo ${st.k+1} de ${c.steps.length}</p>${legendChip()}</div>
    <div id="th">${thermo(v,'Salud del proyecto')}</div>
    <div class="symtag">${svg(ICO[step.s],'')}<div class="nm"><p class="eyebrow" style="margin:0 0 2px">El síntoma</p><p class="symname">${s.sym}</p></div><button class="chip" id="pk">Ver ficha</button></div>
    ${st.k>0?`<div class="reveal" id="rv"><button class="reveal-btn" id="rvb">+ La historia hasta aquí</button><div class="reveal-body">${prev}</div></div>`:''}
    <div class="story ${st.k>0?'':''}">${step.text.map(p=>`<p>${p}</p>`).join('')}</div>
    <p class="q">${step.q}</p>
    <div id="ops">${st.opts.map((o,k)=>`<button class="option" data-k="${k}">${o.t}</button>`).join('')}</div>
    <div id="fb"></div>
    <div class="btn-row"><button class="btn solid" id="act" disabled>Decidir</button></div>
    <p class="hint" id="hn">Puedes cambiar tu elección hasta que decidas</p>
  </div>`;
  const rv=document.getElementById('rv');
  if(rv) document.getElementById('rvb').onclick=()=>{ rv.classList.toggle('open');
    document.getElementById('rvb').textContent=rv.classList.contains('open')?'− Ocultar la historia':'+ La historia hasta aquí'; };
  document.getElementById('pk').onclick=()=>openFicha(step.s);
  app().querySelectorAll('.option').forEach(b=>b.onclick=()=>{
    if(st.decided) return;
    app().querySelectorAll('.option').forEach(x=>x.classList.remove('chosen'));
    b.classList.add('chosen'); st.sel=st.opts[+b.dataset.k];
    document.getElementById('act').disabled=false;
  });
  const act=document.getElementById('act');
  act.onclick=()=>{
    if(!st.decided){
      if(!st.sel) return;
      st.decided=true;
      st.res.push({s:step.s, e:st.sel.e, t:st.sel.t, f:st.sel.f, peek:st.peek});
      app().querySelectorAll('.option').forEach(x=>{ x.classList.add('locked'); x.disabled=true; });
      const r=RS[st.sel.e];
      document.getElementById('fb').innerHTML=`<div class="fb" style="color:${r.c}"><span class="badge">${r.l}</span><p>${st.sel.f}</p></div>`;
      const nv=healthOf(c,st.res); paint(nv);
      document.getElementById('th').innerHTML=thermo(nv,'Salud del proyecto');
      act.textContent= st.k===c.steps.length-1 ? 'Ver cómo termina' : 'Seguir la historia';
      document.getElementById('hn').textContent='';
      setTimeout(()=>document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'center'}),120);
    } else {
      st.k++; st.k>=c.steps.length ? go('end') : go('play');
    }
  };
}

/* ---- symptom ficha (overlay) ---- */
function openFicha(i){
  if(st.screen==='play' && !st.decided) st.peek=true;
  const ov=document.getElementById('ov');
  ov.innerHTML=`<div class="inner wrap"><div class="closebar"><p class="eyebrow" style="margin:0">Ficha del síntoma</p><button class="chip" id="ovx">Volver a la historia ×</button></div>${symCard(i)}
    <div class="btn-row"><button class="btn" id="ovx2">Volver a la historia</button></div></div>`;
  ov.classList.add('open'); ov.scrollTop=0; document.body.style.overflow='hidden';
  const close=()=>{ ov.classList.remove('open'); document.body.style.overflow=''; };
  document.getElementById('ovx').onclick=close; document.getElementById('ovx2').onclick=close;
}

/* ---- end: epilogue + diagnosis + practices ---- */
const NUM=['ninguno','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once'];
function summary(c,res){
  const n=res.length, a=res.filter(r=>r.e===100).length, m=res.filter(r=>r.e===60).length, z=res.filter(r=>r.e===15).length, pk=res.filter(r=>r.peek).length;
  const parts=[];
  const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
  parts.push(a===n?`Resolviste por completo los ${NUM[n]} síntomas.`: a===0?`No resolviste por completo ninguno de los ${NUM[n]} síntomas.`:`Resolviste por completo ${NUM[a]} de los ${NUM[n]} síntomas.`);
  if(m) parts.push(`${m===1?'Uno quedó contenido':cap(NUM[m])+' quedaron contenidos'}: aliviados en la superficie, vivos debajo.`);
  if(z) parts.push(`${z===1?'Uno sigue activo':cap(NUM[z])+' siguen activos'}.`);
  parts.push(pk?`Consultaste la ficha en ${pk===1?'un capítulo':NUM[pk]+' capítulos'}.`:'No consultaste ninguna ficha: todo salió de lo que ya sabías.');
  return parts.join(' ');
}
function epiOf(c,v){ return v>=80?c.epi.hi : v>=40?c.epi.mid : c.epi.lo; }
function end(){
  const c=cur(), s0=startOf(c), v=healthOf(c,st.res), res=st.res;
  st.done[c.id]=v;
  paint(v);
  const watch=res.filter(r=>r.e<100).sort((a,b)=>a.e-b.e), ok=res.filter(r=>r.e===100);
  const prac=r=>`<div class="prac"><h3>${S[r.s].sym}</h3><p class="lab">La señal</p><p>${S[r.s].senal}</p><p class="lab">La pregunta para tu próxima reunión</p><p class="pq">${S[r.s].preg}</p></div>`;
  app().innerHTML=`<div class="screen wrap">
    <div class="bar"><p class="eyebrow" style="margin:0">Cómo termina</p>${legendChip()}</div>
    <h2>${c.title}</h2>
    <div class="story plain" style="margin-top:10px"><p>${epiOf(c,v)}</p></div>
    ${thermo(v,'Salud final del proyecto',true,`Llegó en ${pct(s0)}% · ${bandOf(s0).label}`)}
    <p style="margin-top:18px">${summary(c,res)}</p>

    <div class="sec"><p class="eyebrow">Tus decisiones, capítulo por capítulo</p>
    ${res.map(r=>{ const k=RS[r.e]; return `<div class="dx-item">
      <div style="flex:0 0 38px;color:${k.c}">${svg(ICO[r.s],'dx-ico')}</div>
      <div class="dx-main"><p class="dx-name">${S[r.s].sym}</p>
        <span class="badge" style="color:${k.c}">${k.l}</span>${r.peek?'<span class="peeked">· Consultaste la ficha</span>':''}
        <p class="dx-choice">Tu decisión: ${r.t}</p>
        <p>${r.f}</p></div></div>`;}).join('')}
    </div>

    <div class="sec"><p class="eyebrow">Para reconocerlo a tiempo</p>
      ${watch.length?`<h3>Vigila primero</h3><p style="font-size:.95rem">Estos son los síntomas que quedaron vivos en tu historia. Cada uno tiene una señal que aparece antes del daño, y una pregunta que la hace visible.</p>${watch.map(prac).join('')}`
        :`<p style="font-size:.95rem">Resolviste todos los síntomas por completo. En un proyecto real llegan sin nombre: estas son las señales para reconocerlos.</p>`}
      ${ok.length?(watch.length?`<details class="more"><summary>+ Los que resolviste (${ok.length})</summary>${ok.map(prac).join('')}</details>`:ok.map(prac).join('')):''}
    </div>

    <div class="btn-row">
      <button class="btn" id="dl">Descargar la ficha</button>
      <button class="btn solid" data-go="cases">Resolver otro caso</button>
    </div>
    <div class="btn-row" style="margin-top:12px"><button class="btn" data-go="reset" style="border-style:dashed;font-size:.7rem;padding:10px 18px">Volver al inicio</button></div>
    <p class="foot">Liderazgo en escena · Elefante blanco</p>
  </div>`;
  document.getElementById('dl').onclick=()=>downloadFicha(c,res,v);
}

/* ---- downloadable sheet ---- */
function downloadFicha(c,res,v){
  const s0=startOf(c), b=bandOf(v);
  const rows=res.map(r=>{ const k=RS[r.e]; return `<tr>
    <td class="q"><strong>${S[r.s].sym}</strong></td>
    <td class="s" style="color:${k.c}">${k.l}${r.peek?'<br><em>consultó la ficha</em>':''}</td>
    <td class="d"><p class="ch">${r.t}</p><p>${r.f}</p></td></tr>`;}).join('');
  const pr=res.slice().sort((a,b)=>a.e-b.e).map(r=>`<li><strong>${S[r.s].sym}.</strong> Señal: ${S[r.s].senal} <em>Pregunta: ${S[r.s].preg}</em></li>`).join('');
  const doc=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Ficha · ${c.title}</title>
<style>
body{font-family:Georgia,serif;color:#0d1b1e;max-width:820px;margin:40px auto;padding:0 24px;line-height:1.55;}
h1{font-size:1.9rem;margin:0 0 4px;} h2{font-size:1.15rem;margin:34px 0 10px;}
.sub{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#7a7266;margin:0 0 22px;}
.bar{height:16px;border:1.5px solid #0d1b1e;border-radius:9px;overflow:hidden;margin:8px 0 6px;}
.bar span{display:block;height:100%;background:${col(Math.max(10,v))};width:${Math.max(1.5,v)}%;}
.epi{font-style:italic;border-left:3px solid #0d1b1e;padding-left:14px;}
table{width:100%;border-collapse:collapse;} td{border-top:1px solid #d9d3c7;padding:12px 8px;vertical-align:top;font-size:.9rem;}
td.q{width:24%;} td.s{width:16%;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;}
td.d p{margin:0 0 6px;} .ch{font-style:italic;color:#5a5348;} em{color:#7a7266;}
li{margin-bottom:10px;font-size:.92rem;}
footer{margin-top:34px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#a29884;}
@media print{body{margin:0;}}
</style></head><body>
<h1>Anatomía de un elefante blanco · ${c.title}</h1>
<p class="sub">Caso ${c.level.toLowerCase()} · ${c.steps.length} síntomas · ${new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'})}</p>
<p class="epi">${epiOf(c,v)}</p>
<p><strong>Salud final: ${b.label} · ${pct(v)}%</strong> (llegó en ${pct(s0)}% · ${bandOf(s0).label})</p>
<div class="bar"><span></span></div>
<p>${summary(c,res)}</p>
<h2>Decisiones</h2><table>${rows}</table>
<h2>Para reconocerlo a tiempo</h2><ul>${pr}</ul>
<footer>Liderazgo en escena · Elefante blanco</footer>
</body></html>`;
  const blob=new Blob([doc],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`ficha-elefante-blanco-${c.id}.html`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

/* ========================= ROUTER ========================= */
function go(s){ st.screen=s; render(); }
function render(){
  document.getElementById('ov').classList.remove('open'); document.body.style.overflow='';
  st._resize=null;
  window.scrollTo({top:0,behavior:'instant'});
  ({l1,l2,tour,cases,intro,play,end})[st.screen]();
}
document.getElementById('sheet-body').innerHTML=legendHTML();
document.addEventListener('click',e=>{
  if(e.target.closest('[data-legend]')){ document.getElementById('sheet').classList.toggle('open'); return; }
  const cc=e.target.closest('[data-case]');
  if(cc){ st.cid=cc.dataset.case; st.k=0; st.res=[]; return go('intro'); }
  const t=e.target.closest('[data-go]'); if(!t) return;
  const d=t.dataset.go;
  if(d==='tour'){ st.ti=0; }
  if(d==='reset'){ st.ti=0; st.cid=null; st.res=[]; st.k=0; return go('l1'); }
  go(d);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ document.getElementById('sheet').classList.remove('open'); const ov=document.getElementById('ov'); if(ov.classList.contains('open')){ ov.classList.remove('open'); document.body.style.overflow=''; } }
  if(st.screen!=='tour') return;
  if(e.key==='ArrowRight') document.getElementById('nxt').click();
  if(e.key==='ArrowLeft') document.getElementById('prv').click();
});
window.addEventListener('resize',()=>{ if(st._resize) st._resize(); });
render();
</script>
</body>
